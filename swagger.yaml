openapi: 3.0.4
info:
  title: Clone X API
  description: |-
    API documentation for Clone X - A Twitter-like social media platform.

    This API provides endpoints for authentication, user management, tweets, and messaging functionality.
  termsOfService: https://swagger.io/terms/
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io
servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://your-production-url.com
    description: Production server
tags:
  - name: auth
    description: Authentication operations
  - name: user
    description: User management operations
  - name: tweet
    description: Tweet operations
  - name: media
    description: Media upload operations
  - name: conversation
    description: Conversation operations
  - name: message
    description: Message operations

x-socket-events:
  "@conversation:send":
    description: Direct messages are checked for blocks in both directions. Optional reply_to_message_id must reference a sent message in the same conversation before any insert.
    payload:
      $ref: "#/components/schemas/ConversationSendPayload"
    acknowledgement:
      $ref: "#/components/schemas/ConversationSendAcknowledgement"
    errorEvent: "@conversation:error"
    blockedError:
      $ref: "#/components/schemas/ConversationSocketError"
  "@conversation:receive":
    description: Emitted to conversation members' personal rooms. The message includes public sender_info, medias_info and a compact reply_to preview.
    payload:
      $ref: "#/components/schemas/ConversationMessage"
  "@message:revoked":
    description: Emitted to conversation members after the sender atomically replaces a sent message with a payload-free tombstone, refreshes the last-message preview when needed and invalidates its message cache.
    payload:
      $ref: "#/components/schemas/MessageRevokedEvent"
  "@message:deleted":
    description: Emitted to conversation members after the legacy global delete mutation and cache invalidation.
  "@message:reacted":
    description: Emitted to conversation members after a reaction is stored and cache invalidated.
  "@message:unreacted":
    description: Emitted to conversation members after the actor's reaction is removed and cache invalidated.
  "@user:block-status-changed":
    description: Emitted to both users after a block or unblock succeeds. Clients refetch the authoritative two-way profile state.
    payload:
      $ref: "#/components/schemas/UserBlockStatusChanged"
  "@conversation:group-updated":
    description: Emitted to affected users' personal rooms after group information or membership changes. Membership cache is invalidated before this event.
    payload:
      $ref: "#/components/schemas/GroupUpdatedEvent"

paths:
  /api/auth/register:
    post:
      tags:
        - auth
      summary: Register a new user account
      description: Register a new user account and send email verification
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthTokenResponse"
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: "Register success, please check your email to verify your account"
        "400":
          description: Bad request - Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      tags:
        - auth
      summary: User login
      description: Authenticate user with email/username and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthTokenResponse"
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: "Login success"
        "400":
          description: Bad request - Validation error or user does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      tags:
        - auth
      summary: User logout
      description: Logout user and invalidate tokens
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: "Logout success"
        "400":
          description: Bad request - Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/refresh-token:
    post:
      tags:
        - auth
      summary: Refresh access token
      description: Get new access token using refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "201":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthTokenResponse"
                  - type: object
                    properties:
                      statusCode:
                        example: 201
                      message:
                        example: "Refresh token success"
        "400":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Token expired or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/verify-email:
    post:
      tags:
        - auth
      summary: Verify email address
      description: Verify user email using verification token
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: "Verify email success"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/resend-verify-email:
    post:
      tags:
        - auth
      summary: Resend email verification
      description: Resend email verification link
      operationId: resendVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Verification email sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: "Resend verify email success"
        "400":
          description: Bad request - Invalid email or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Email does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/forgot-password:
    post:
      tags:
        - auth
      summary: Request password reset
      description: Send password reset link to user email
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Password reset email sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: "Forgot password success, please check your email to reset your password"
        "400":
          description: Bad request - Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/verify-forgot-password:
    post:
      tags:
        - auth
      summary: Verify password reset token
      description: Verify password reset token from email link
      operationId: verifyForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token verified successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: "Verify forgot password token success"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/reset-password:
    post:
      tags:
        - auth
      summary: Reset password
      description: Reset user password using verified token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthTokenResponse"
                  - type: object
                    properties:
                      statusCode:
                        example: 200
                      message:
                        example: "Password reset success"
        "400":
          description: Invalid token or password validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/change-password:
    patch:
      tags:
        - auth
      summary: Change password
      description: Change user password (requires authentication)
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: "Change password success"
        "400":
          description: Bad request - Validation error or incorrect old password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized - Invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden - User not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/user/profile/{username}:
    get:
      tags:
        - user
      summary: Get a public user profile
      description: When authenticated, is_blocked means the caller blocked this profile and is_blocked_by_user means this profile blocked the caller.
      operationId: getUserProfile
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/direct/{receiver_id}:
    post:
      tags:
        - conversation
      summary: Open or create a direct conversation
      description: Does not create or restore a direct conversation when either participant has blocked the other. Existing message history is not deleted.
      operationId: getOrCreateDirectConversation
      security:
        - bearerAuth: []
      parameters:
        - name: receiver_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      responses:
        "200":
          description: Direct conversation opened successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Direct messaging is blocked in either direction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/groups/search:
    get:
      tags:
        - conversation
      summary: Search the authenticated user's group conversations
      description: Searches visible and hidden groups by name. Only groups where the authenticated user is still a member are returned. This endpoint does not restore hidden groups.
      operationId: searchGroupConversations
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Matching group conversations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupConversationLookupPageResponse"
        "400":
          description: Invalid search query, cursor, or limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/{conversation_id}:
    patch:
      tags:
        - conversation
      summary: Update group information
      description: Only a current group admin can update the group name or avatar.
      operationId: updateGroupInformation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                avatar_url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Group information updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: The caller is not a group admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - conversation
      summary: Hide a conversation from your inbox
      description: Hides the conversation only for the authenticated member. It does not delete message history for other members, and receiving new messages does not restore it. The authenticated member must explicitly find and reopen it.
      operationId: hideConversationFromInbox
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation hidden from the authenticated user's inbox
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: "Conversation hidden from your inbox successfully"
                      data:
                        type: object
                        required:
                          - success
                        properties:
                          success:
                            type: boolean
                            example: true
        "403":
          description: The authenticated user is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/{conversation_id}/unhide:
    post:
      tags:
        - conversation
      summary: Restore a conversation to your inbox
      description: Removes only the authenticated member from hidden_by. The operation is idempotent and does not change another member's hidden state.
      operationId: unhideConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation restored to the authenticated user's inbox
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      message:
                        example: "Conversation restored to your inbox successfully"
                      data:
                        type: object
                        required:
                          - success
                        properties:
                          success:
                            type: boolean
                            example: true
        "403":
          description: The authenticated user is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/{conversation_id}/members:
    get:
      tags:
        - conversation
      summary: Get group members
      description: The authenticated caller must be a current member. Each member user contains only _id, name, username, and avatar.
      operationId: getGroupMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Group members retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: The caller is not a group member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - conversation
      summary: Add group members
      description: Any current group member can add existing users they follow. The complete list is appended in one atomic update pipeline, membership is compared by user_id, and concurrent requests cannot create duplicates or partial success. This operation emits membership sync only and does not create a system message or notification.
      operationId: addGroupMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - members
              properties:
                members:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    pattern: "^[a-fA-F0-9]{24}$"
      responses:
        "200":
          description: Members added or already present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid, duplicate, unknown, or non-followed user IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not a current group member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/{conversation_id}/members/{user_id}:
    delete:
      tags:
        - conversation
      summary: Remove a group member
      description: A current admin can remove another member, but cannot remove themselves through this endpoint.
      operationId: removeGroupMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: GROUP_ADMIN_CANNOT_REMOVE_SELF; use the leave endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is not a group admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group or target member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Membership changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/{conversation_id}/leave:
    delete:
      tags:
        - conversation
      summary: Leave a group
      description: A member can leave. The sole admin cannot leave while other members remain because admin transfer is not implemented.
      operationId: leaveGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Member left the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: The caller is not a group member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: GROUP_SOLE_ADMIN_CANNOT_LEAVE or membership changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/{conversation_id}/messages:
    get:
      tags:
        - message
      summary: Get messages in a conversation
      description: Returns a cursor-paginated message page. The authenticated user must be a conversation member.
      operationId: getConversationMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageCursor"
        - $ref: "#/components/parameters/MessageLimit"
      responses:
        "200":
          description: Messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePageResponse"
        "403":
          description: The authenticated user is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/{conversation_id}/messages/{message_id}/context:
    get:
      tags:
        - message
      summary: Get messages around a target message
      description: Returns active messages around a target in chronological order. The authenticated user must be a conversation member.
      operationId: getConversationMessageContext
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: message_id
          in: path
          required: true
          schema:
            type: string
        - name: before
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 20
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 20
      responses:
        "200":
          description: Message context retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageContextResponse"
        "403":
          description: The authenticated user is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation or target message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/{conversation_id}/search:
    get:
      tags:
        - message
      summary: Search active messages in a conversation
      description: Searches only messages with status sent. The authenticated user must be a conversation member.
      operationId: searchConversationMessages
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/MessageCursor"
        - $ref: "#/components/parameters/MessageLimit"
      responses:
        "200":
          description: Matching messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePageResponse"
        "403":
          description: The authenticated user is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/{conversation_id}/media:
    get:
      tags:
        - conversation
        - media
      summary: Get shared media in a conversation
      description: Returns active messages containing ready image, video, or audio metadata in medias_info. The authenticated user must be a conversation member.
      operationId: getConversationMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageCursor"
        - $ref: "#/components/parameters/MessageLimit"
      responses:
        "200":
          description: Shared media retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePageResponse"
        "403":
          description: The authenticated user is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/messages/{message_id}:
    delete:
      tags:
        - message
      summary: Delete a sent message using the legacy global status mutation
      description: Currently restricted to the sender while they are still a conversation member. Delete-for-me will use a separate contract.
      operationId: deleteConversationMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message deleted and member personal rooms synchronized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid message ID or message is not in sent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a member or is not the sender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/messages/{message_id}/revoke:
    post:
      tags:
        - message
      summary: Revoke a sent message for everyone
      operationId: revokeConversationMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message revoked and member personal rooms synchronized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid message ID or message is not in sent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a member or is not the sender
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/messages/{message_id}/react:
    post:
      tags:
        - message
      summary: React to a sent message
      operationId: reactToConversationMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emoji
              properties:
                emoji:
                  type: string
                  minLength: 1
                  maxLength: 32
      responses:
        "200":
          description: Reaction stored and member personal rooms synchronized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid input or message is not in sent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - message
      summary: Remove the caller's reaction from a sent message
      operationId: unreactToConversationMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Reaction removed and member personal rooms synchronized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Caller is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/conversations/messages/{message_id}/reactions:
    get:
      tags:
        - message
      summary: Get reaction details for a sent message
      operationId: getConversationMessageReactions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Reaction details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Caller is not a conversation member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    MessageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
    MessageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-fA-F0-9]{24}$"
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          example: johndoe
        bio:
          type: string
          example: Software developer
        avatar:
          type: string
          example: https://example.com/avatar.jpg
        cover_photo:
          type: string
          example: https://example.com/cover.jpg
        date_of_birth:
          type: string
          format: date-time
          example: 1990-01-01T00:00:00.000Z
        location:
          type: string
          example: New York, USA
        website:
          type: string
          example: https://johndoe.com
        verify:
          type: integer
          example: 1
          description: User verification status (0=Unverified, 1=Verified, 2=Banned)
        created_at:
          type: string
          format: date-time
          example: 2023-01-01T00:00:00.000Z
        updated_at:
          type: string
          format: date-time
          example: 2023-01-01T00:00:00.000Z
        is_following:
          type: boolean
        is_blocked:
          type: boolean
          description: The authenticated caller blocked this profile.
        is_blocked_by_user:
          type: boolean
          description: This profile blocked the authenticated caller.

    UserProfileResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/User"

    ConversationSocketError:
      type: object
      required:
        - code
        - conversation_id
        - message
      properties:
        code:
          type: string
          enum: [DIRECT_MESSAGE_BLOCKED, REPLY_MESSAGE_UNAVAILABLE]
        conversation_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        message:
          type: string

    ConversationSendPayload:
      type: object
      required:
        - conversation_id
        - conversation_type
        - content
      properties:
        conversation_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        conversation_type:
          type: string
          enum: [direct, group]
        content:
          type: string
        media_ids:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
        reply_to_message_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"

    ConversationSendAcknowledgement:
      oneOf:
        - type: object
          required:
            - success
            - message_id
          properties:
            success:
              type: boolean
              enum: [true]
            message_id:
              type: string
              pattern: "^[a-fA-F0-9]{24}$"
        - type: object
          required:
            - success
            - error
          properties:
            success:
              type: boolean
              enum: [false]
            error:
              type: object
              required:
                - code
                - message
              properties:
                code:
                  type: string
                conversation_id:
                  type: string
                  pattern: "^[a-fA-F0-9]{24}$"
                message:
                  type: string

    UserBlockStatusChanged:
      type: object
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"

    MessageRevokedEvent:
      type: object
      required:
        - conversation_id
        - message_id
      properties:
        conversation_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        message_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"

    GroupUpdatedEvent:
      type: object
      required:
        - conversation_id
        - change_type
        - actor_id
        - affected_user_ids
      properties:
        conversation_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        change_type:
          type: string
          enum: [info_updated, members_added, member_removed, member_left]
        actor_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        affected_user_ids:
          type: array
          items:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"

    # Base response schemas
    SuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: "Operation successful"
      required:
        - statusCode
        - message

    GroupConversationLookupItem:
      type: object
      required:
        - _id
        - name
        - member_count
        - is_hidden
      properties:
        _id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        name:
          type: string
        avatar_url:
          type: string
          format: uri
        member_count:
          type: integer
          minimum: 1
        is_hidden:
          type: boolean

    GroupConversationLookupPageResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              type: object
              required:
                - groups
                - next_cursor
                - has_next_page
              properties:
                groups:
                  type: array
                  items:
                    $ref: "#/components/schemas/GroupConversationLookupItem"
                next_cursor:
                  type: string
                  nullable: true
                  pattern: "^[a-fA-F0-9]{24}$"
                has_next_page:
                  type: boolean

    MediaMetadata:
      type: object
      required:
        - _id
        - url
        - type
        - status
      properties:
        _id:
          type: string
        url:
          type: string
          format: uri
        thumbnail:
          type: string
          format: uri
        type:
          type: string
          enum: [image, video, audio]
        status:
          type: string
          enum: [ready]

    MessageSenderInfo:
      type: object
      required:
        - _id
        - name
        - username
      properties:
        _id:
          type: string
        name:
          type: string
        username:
          type: string
        avatar:
          type: string

    MessageReplyPreview:
      type: object
      required:
        - _id
        - sender_info
        - content
        - status
      properties:
        _id:
          type: string
        sender_info:
          allOf:
            - $ref: "#/components/schemas/MessageSenderInfo"
          nullable: true
        content:
          type: string
          maxLength: 140
        media_type:
          type: string
          enum: [image, video, audio]
        status:
          type: string
          enum: [sent, revoked]

    ConversationMessage:
      type: object
      required:
        - _id
        - conversation_id
        - conversation_type
        - sender_id
        - sender_info
        - reply_to
        - content
        - media_ids
        - send_at
        - status
        - reactions
      properties:
        _id:
          type: string
        conversation_id:
          type: string
        conversation_type:
          type: string
          enum: [direct, group]
        sender_id:
          type: string
        sender_info:
          allOf:
            - $ref: "#/components/schemas/MessageSenderInfo"
          nullable: true
        reply_to_message_id:
          type: string
          nullable: true
        reply_to:
          allOf:
            - $ref: "#/components/schemas/MessageReplyPreview"
          nullable: true
        content:
          type: string
        media_ids:
          type: array
          items:
            type: string
        medias_info:
          type: array
          items:
            $ref: "#/components/schemas/MediaMetadata"
        send_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [sent, revoked, deleted]
        reactions:
          type: array
          items:
            type: object
            additionalProperties: true

    MessagePageData:
      type: object
      required:
        - messages
        - next_cursor
        - has_next_page
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        next_cursor:
          type: string
          nullable: true
        has_next_page:
          type: boolean

    MessagePageResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/MessagePageData"

    MessageContextData:
      type: object
      required:
        - messages
        - target_message_id
        - older_cursor
        - newer_cursor
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        target_message_id:
          type: string
        older_cursor:
          type: string
          nullable: true
        newer_cursor:
          type: string
          nullable: true

    MessageContextResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/MessageContextData"

    # Token related schemas
    TokenData:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjc2MDU5NGRjMzQ4YzIzMzEwMzQ2YjkwIiwidG9rZW5fdHlwZSI6ImFjY2Vzc190b2tlbiIsInZlcmlmeSI6MSwiaWF0IjoxNzM0Mzc0ODA1LCJleHAiOjE3MzQzNzU3MDV9.xyz123"
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjc2MDU5NGRjMzQ4YzIzMzEwMzQ2YjkwIiwidG9rZW5fdHlwZSI6InJlZnJlc2hfdG9rZW4iLCJ2ZXJpZnkiOjEsImlhdCI6MTczNDM3NDgwNSwiZXhwIjoxNzM3MDUzMjA1fQ.abc456"
      required:
        - access_token
        - refresh_token

    AuthTokenResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TokenData"

    # Request schemas
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - confirm_password
        - date_of_birth
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "John Doe"
          description: "User's full name"
        email:
          type: string
          format: email
          example: "user@example.com"
          description: "User's email address"
        password:
          type: string
          minLength: 6
          example: "P@ssw0rd123"
          description: "Password must contain at least 6 characters with uppercase, lowercase, number and special character"
        confirm_password:
          type: string
          minLength: 6
          example: "P@ssw0rd123"
          description: "Must match the password field"
        date_of_birth:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "1990-01-01"
          description: "Date of birth in YYYY-MM-DD format"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "P@ssw0rd123"

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjc2MDU5NGRjMzQ4YzIzMzEwMzQ2YjkwIiwidG9rZW5fdHlwZSI6InJlZnJlc2hfdG9rZW4iLCJ2ZXJpZnkiOjEsImlhdCI6MTczNDM3NDgwNSwiZXhwIjoxNzM3MDUzMjA1fQ.abc456"

    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"

    TokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: "verification-token-here"

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
        - confirm_password
      properties:
        old_password:
          type: string
          example: "P@ssw0rd123"
          description: "Current password"
        new_password:
          type: string
          minLength: 6
          example: "P@ssw0rd1234"
          description: "New password must contain at least 6 characters with uppercase, lowercase, number and special character"
        confirm_password:
          type: string
          minLength: 6
          example: "P@ssw0rd1234"
          description: "Must match the new password field"

    ResetPasswordRequest:
      type: object
      required:
        - token
        - new_password
      properties:
        token:
          type: string
          example: "verified-reset-token"
          description: "The verified reset token from verify-forgot-password endpoint"
        new_password:
          type: string
          minLength: 6
          example: "P@ssw0rd1234"
          description: "New password must contain at least 6 characters with uppercase, lowercase, number and special character"

    Error:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
          description: HTTP status code
        message:
          type: string
          example: "Validation failed"
          description: Error message describing what went wrong
        error:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            "body.email": ["Email must be valid"]
            "body.password": ["Password is required"]
          description: Detailed validation errors (optional, only present for validation failures)
        code:
          type: string
          description: Stable optional application error code; clients should branch on this value instead of parsing message text.
          example: "GROUP_SOLE_ADMIN_CANNOT_LEAVE"
      required:
        - statusCode
        - message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
